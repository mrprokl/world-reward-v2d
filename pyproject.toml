[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "world-reward-v2d"
version = "0.1.0"
description = "Leakage-safe monocular human-object reconstruction for V2D Track 1"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
data = ["huggingface-hub>=1.0", "pyarrow>=14"]
dev = ["pytest>=8", "Pillow>=10.2", "h5py==3.14.0", "joblib==1.5.2"]

[project.scripts]
wr-data = "world_reward.data:main"

[tool.hatch.build.targets.wheel]
packages = ["src/world_reward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixtures are disposable; retain only concise asserted test results.
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0
